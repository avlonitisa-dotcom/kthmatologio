services:
  - type: web
    name: tee-kaek-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard           # needs at least Standard for Playwright memory
    region: frankfurt        # closest to Greece
    buildCommand: "./build.sh"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/status

    disk:
      name: kaek-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10

    envVars:
      # ── App auth (set these in Render dashboard, not here) ──
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false

      # ── TEE credentials (set in Render dashboard) ──
      - key: TEE_USERNAME
        sync: false
      - key: TEE_PASSWORD
        sync: false

      # ── Portal URLs ──
      - key: TEE_SSO_URL
        value: https://sso.tee.gr/auth/realms/tee/protocol/openid-connect/auth
      - key: KTIMATOLOGIO_PORTAL_URL
        value: https://www.ktimatologio.gr/
      - key: MAP_BASE_URL
        value: https://maps.ktimatologio.gr/

      # ── Runtime ──
      - key: HEADLESS
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: MIN_DELAY
        value: "3.0"
      - key: MAX_DELAY
        value: "6.0"
      - key: MAX_RETRIES
        value: "2"
      - key: MAP_BROWSER_ENABLED
        value: "false"

      # ── Optional: Claude LLM for PDF classification ──
      # - key: ANTHROPIC_API_KEY
      #   sync: false
